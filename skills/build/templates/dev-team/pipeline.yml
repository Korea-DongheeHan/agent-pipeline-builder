# 기본 파이프라인 템플릿: 설계 → (병렬 구현) → 테스트 → 리뷰 + 피드백 루프
# 이 하나의 구성으로 개발 팀·배치 워크플로우 모두 자유롭게 변형한다.
#   - 순차 체인만 필요하면 workflow 에 노드를 나열만 하면 된다
#   - 값 기반 다중 분기는 branch 블록, 상태 체크 점프는 if/goto (references/yml-spec.md)
# 실행: python3 scripts/run_graph.py pipeline.yml --var requirement="요구사항"
name: dev-team
kind: development

settings:
  parallelism: 4
  state_dir: .graph-runs
  # 서브 에이전트 claude 세션에 전달할 공통 인자
  claude_args: ["--permission-mode", "acceptEdits"]

vars:
  requirement: "구현할 요구사항을 --var requirement=... 로 주입하라"

nodes:
  - id: architect
    prompt: prompts/architect.md
  - id: impl-core
    prompt: prompts/impl-core.md
  - id: impl-api
    prompt: prompts/impl-api.md
  - id: test
    prompt: prompts/test.md
  - id: review
    prompt: prompts/review.md

# 워크플로우는 위에서 아래로 읽는다. START/END 는 자동 연결.
# 노드에 if/goto 를 부착하면 그 노드의 상태·출력을 체크해 점프한다.
# 이미 나온 노드로의 goto 는 자동으로 피드백 루프 (max 초과 시 exhausted, 기본 FAIL).
workflow:
  - architect
  - parallel: [impl-core, impl-api]   # Fan-Out — 다음 스텝(test)에서 Fan-In
  - test:
      if: FAILED                      # 테스트 실패 → 구현 재작업 루프
      goto: [impl-core, impl-api]
      max: 3
  - review:
      if: FAILED                      # 리뷰 REQUEST_CHANGES → 재작업 루프
      goto: [impl-core, impl-api]
      max: 3
