# {{project_name}} development orchestration pipeline
#
# Flow: analysis → [spec gate ⏸] → (implement ‖ test authoring) → build check
#       → (QA ‖ review) → escalation report when the loop is exhausted
#       build/QA/review failure → implementation rework convergence loop (max 2)
#
# The build check is a shell step, not an agent: a broken build is decided by an
# exit code, so it must not cost an agent session. QA and review run together —
# QA runs the build, review reads the diff, and neither waits on the other.
#
# Spec gate (SDD): once the analyst produces the spec draft and the questions
# to confirm, the pipeline pauses (exit 3). The orchestrator (Claude) confirms
# the spec via AskUserQuestion, then resumes with
# --resume + --var decisions="confirmed summary".
#
# Syntax summary (full spec: the agent-pipeline-builder plugin, references/yml-spec.md):
#   - listed nodes = sequence (START/END wired automatically)
#   - parallel: [a, b] = fan-out, fan-in at the next step
#   - {if, goto, max, exhausted} attached to a node = status-checked jump
#     (goto to an already-placed node = feedback loop)
#   - branch: {on: key, cases: ...} = multi-case routing
name: "{{pipeline_name}}"
kind: development

settings:
  lang: en               # language of runner logs and injected protocol (en | ko)
                         # — set to the language chosen at scaffold time
  mode: session          # default execution mode. session = Claude runs it
                         #   with the Agent tool (live tree view, intervention)
                         # runner = script execution
                         #   (deterministic, resume, unattended)
                         # Override per run by asking ("in runner mode")
  parallelism: 4
  state_dir: .graph-runs
  claude_args: ["--permission-mode", "acceptEdits"]
  node_timeout: 3600

vars:                      # pipeline inputs — declared here, filled per run.
                           # Session mode: Claude fills them from the conversation.
                           # Runner mode: --var overrides these defaults; merged
                           # values persist in <run-dir>/vars.json, so --resume
                           # needs no re-passing. Defaults below are sentinels
                           # that surface a missing injection.
  requirement: "(no requirement injected — state the task before running)"
  decisions: "(spec gate not confirmed — following the analyst draft's assumptions)"

nodes:
  - id: analyst
    agent: "{{prefix}}-analyst"        # role definition from .claude/agents/
    prompt: prompts/analyst.md
  - id: spec-gate
    gate: true                         # SDD spec confirmation gate — pauses here
  - id: implement
    agent: "{{prefix}}-implementer"
    prompt: prompts/implement.md
    persist: true                      # session mode: keep the subagent alive across
                                       # rework loops (feedback via SendMessage).
                                       # Runner mode ignores this
  - id: test
    agent: "{{prefix}}-test-engineer"
    prompt: prompts/test.md
    model: sonnet                      # per-node model delegation: procedural roles run on
                                       # a cheaper model. Judgment roles (analyst, reviewer)
                                       # omit model to keep the strong default. Precedence:
                                       # node model > agent definition > settings.model
  - id: qa
    agent: "{{prefix}}-qa"
    prompt: prompts/qa.md
    model: sonnet
    context: [analyst]                 # 직속 업스트림은 implement·test 뿐이다. 인수 기준
                                       # 원본을 판정 노드에 넣으려면 context 로 끌어온다.
                                       # 프롬프트가 `노드id` 를 언급하는데 이 선언이 빠지면
                                       # --validate 가 경고한다
  - id: review
    agent: "{{prefix}}-reviewer"
    prompt: prompts/review.md
    context: [analyst]                 # 변경 의도와 인수 기준 원본
  - id: build-check
    type: command                      # no agent session — the exit code is the verdict
    run: "{{build_command}}"           # the project's cheapest whole-build command
    timeout: 900
  - id: escalate
    prompt: prompts/escalate.md        # no dedicated agent — report authoring only

workflow:
  - analyst
  - spec-gate                          # ⏸ no implementation before the spec is confirmed
  - parallel: [implement, test]        # fan-out — fan-in at build-check
  - build-check:
      if: FAILED                       # broken build → rework before any agent judges it
      goto: implement
      max: 2
      exhausted: escalate              # exhaustion → report node runs, then auto-fail
  - parallel:                          # QA runs it, review reads it — no dependency between them
      - qa:
          if: FAILED                   # acceptance FAIL → implementation rework
          goto: implement
          max: 2
          exhausted: escalate
      - review:
          if: FAILED                   # REQUEST_CHANGES → rework
          goto: implement
          max: 2
          exhausted: escalate
