# {{project_name}} development orchestration pipeline
#
# Flow: analysis → [spec gate ⏸] → (implement ‖ test authoring) → QA (fan-in) → review
#       QA/review failure → implementation rework convergence loop (max 2)
#       → escalation report on exhaustion
#
# Spec gate (SDD): once the analyst produces the spec draft and the questions
# to confirm, the pipeline pauses (exit 3). The orchestrator (Claude) confirms
# the spec via AskUserQuestion, then resumes with
# --resume + --var decisions="confirmed summary".
#
# Syntax summary (full spec: the agent-pipeline-builder plugin, references/yml-spec.md):
#   - listed nodes = sequence (START/END wired automatically)
#   - parallel: [a, b] = fan-out, fan-in at the next step
#   - {if, goto, max, exhausted} attached to a node = status-checked jump
#     (goto to an already-placed node = feedback loop)
#   - branch: {on: key, cases: ...} = multi-case routing
name: "{{pipeline_name}}"
kind: development

settings:
  lang: en               # language of runner logs and injected protocol (en | ko)
                         # — set to the language chosen at scaffold time
  mode: runner           # default execution mode. runner = script execution
                         #   (deterministic, resume, unattended)
                         # session = Claude runs it with the Agent tool
                         #   (live tree view, intervention)
                         # Override per run by asking ("in session mode")
  parallelism: 4
  state_dir: .graph-runs
  claude_args: ["--permission-mode", "acceptEdits"]
  node_timeout: 3600

vars:
  requirement: "inject the requirement with --var requirement=..."
  decisions: "(spec gate not confirmed — following the analyst draft's assumptions)"

nodes:
  - id: analyst
    agent: "{{prefix}}-analyst"        # role definition from .claude/agents/
    prompt: prompts/analyst.md
  - id: spec-gate
    gate: true                         # SDD spec confirmation gate — pauses here
  - id: implement
    agent: "{{prefix}}-implementer"
    prompt: prompts/implement.md
  - id: test
    agent: "{{prefix}}-test-engineer"
    prompt: prompts/test.md
  - id: qa
    agent: "{{prefix}}-qa"
    prompt: prompts/qa.md
  - id: review
    agent: "{{prefix}}-reviewer"
    prompt: prompts/review.md
  - id: escalate
    prompt: prompts/escalate.md        # no dedicated agent — report authoring only

workflow:
  - analyst
  - spec-gate                          # ⏸ no implementation before the spec is confirmed
  - parallel: [implement, test]        # fan-out — fan-in at qa
  - qa:
      if: FAILED                       # acceptance FAIL → implementation rework
      goto: implement
      max: 2
      exhausted: escalate              # exhaustion → report node runs, then auto-fail
  - review:
      if: FAILED                       # REQUEST_CHANGES → rework
      goto: implement
      max: 2
      exhausted: escalate
