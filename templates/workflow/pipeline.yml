# workflow 템플릿: 태스크 체인 + GRAPH_OUTPUT 기반 조건 분기
# 실행: python3 scripts/run_graph.py pipeline.yml
name: workflow
kind: workflow

settings:
  parallelism: 4
  state_dir: .graph-runs
  claude_args: ["--permission-mode", "acceptEdits"]

nodes:
  - id: prepare
    prompt: prompts/prepare.md
  - id: process-heavy
    prompt: prompts/process-heavy.md
  - id: process-light
    prompt: prompts/process-light.md
  - id: finalize
    prompt: prompts/finalize.md

# 워크플로우는 위에서 아래로 읽는다. START/END 는 자동 연결.
workflow:
  - prepare
  - branch:                    # prepare 가 보고한 GRAPH_OUTPUT.route 로 분기
      on: route
      cases:
        heavy: process-heavy
        light: process-light
  - finalize                   # 분기 합류점 — 자동으로 join: any

# 어떤 태스크든 FAILED 를 처리하는 경로가 없으면 파이프라인이 즉시 FAILED 로
# 끝난다 (기본 동작). 실패 후처리가 필요하면 STATUS branch 로 명시한다:
#   - prepare
#   - branch:
#       cases:
#         SUCCEEDED: [ ...정상 경로... ]
#         FAILED: [on-failure, FAIL]    # 후처리 후 의도적 실패 종결
