# development 팀 템플릿: 설계 → (병렬 구현) → 테스트 → 리뷰 + 피드백 루프
# 실행: python3 scripts/run_graph.py pipeline.yml --var requirement="요구사항"
name: dev-team
kind: development

settings:
  parallelism: 4
  state_dir: .graph-runs
  # 서브 에이전트 claude 세션에 전달할 공통 인자
  claude_args: ["--permission-mode", "acceptEdits"]

vars:
  requirement: "구현할 요구사항을 --var requirement=... 로 주입하라"

nodes:
  - id: architect
    prompt: prompts/architect.md
  - id: impl-core
    prompt: prompts/impl-core.md
  - id: impl-api
    prompt: prompts/impl-api.md
  - id: test
    prompt: prompts/test.md
  - id: review
    prompt: prompts/review.md

# 워크플로우는 위에서 아래로 읽는다. START/END 는 자동 연결.
workflow:
  - architect
  - loop:                              # test/review 실패 → 구현 재작업 (최대 3회)
      max: 3
      redo: [impl-core, impl-api]      # 실패 시 재실행할 노드
      body:
        - parallel: [impl-core, impl-api]   # Fan-Out — 다음 스텝(test)에서 Fan-In
        - test
        - review
