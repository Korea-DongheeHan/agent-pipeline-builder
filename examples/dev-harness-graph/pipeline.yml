# 대화형 오케스트레이터 하네스 스킬(분석 → 팀 구현 → 리뷰 → 수렴 루프)을
# 그래프로 변환한 예제.
#
# 매핑 (자세한 대응·한계는 같은 디렉토리의 README.md):
#   분석 Phase (서브 에이전트)                → analyst
#   구현 팀 Phase (implementer/test/qa 동시)  → parallel Fan-Out + qa Fan-In
#   리뷰 Phase                               → review
#   수렴 루프 (acceptance FAIL → 재작업)       → loop 블록 (qa/review FAILED → implement)
#   N회 연속 FAIL 에스컬레이션                → max + exhausted 경로
#
# 실행 (대상 저장소 루트에서):
#   python3 <graph-builder>/scripts/run_graph.py \
#     <graph-builder>/examples/dev-harness-graph/pipeline.yml \
#     --var requirement="구현할 요구사항"
name: dev-harness-graph
kind: development

settings:
  parallelism: 4
  state_dir: .graph-runs
  claude_args: ["--permission-mode", "acceptEdits"]
  node_timeout: 3600

vars:
  requirement: "구현할 요구사항을 --var requirement=... 로 주입하라"

nodes:
  - id: analyst
    prompt: prompts/analyst.md
    # agent: my-analyst        # 실행 저장소에 전용 에이전트 정의(.claude/agents)가
    #                          # 있으면 주석 해제 — 역할·모델·도구는 그 정의를 따른다
  - id: implement
    prompt: prompts/implement.md
    # agent: my-implementer
  - id: test
    prompt: prompts/test.md
    # agent: my-test-engineer
  - id: qa
    prompt: prompts/qa.md
    # agent: my-qa
  - id: review
    prompt: prompts/review.md
    # agent: my-reviewer
  - id: escalate
    prompt: prompts/escalate.md

# 워크플로우는 위에서 아래로 읽는다. START/END 는 자동 연결.
workflow:
  - analyst
  - loop:                              # 수렴 루프: qa/review 실패 → implement 재작업
      max: 2                           # 같은 판정 2회 초과 실패 시 소진
      exhausted: [escalate, FAIL]      # 소진 → 에스컬레이션 보고 후 의도적 실패 종결
      redo: implement
      body:
        - parallel: [implement, test]  # 팀 Phase Fan-Out
        - qa                           # Fan-In (구현·테스트 둘 다 끝나야 실행)
        - review                       # APPROVE 면 루프 탈출 → END (커밋은 사람 게이트)
