# 사용자 제공 tasks/dependencies 예시를 graph-builder 형식으로 변환한 예제.
#
# 원본 (배치 워크플로우 형식):
#   point-leave-request-generate
#     → (STATUS SUCCEEDED) point-leave-user-point-deduct
#     → (STATUS SUCCEEDED) point-dept-point-tracking
#
# 실행: python3 scripts/run_graph.py examples/point-leave/pipeline.yml --mock
name: point-leave
kind: workflow

settings:
  parallelism: 2
  state_dir: .graph-runs
  claude_args: ["--permission-mode", "acceptEdits"]

nodes:
  - id: point-leave-request-generate
    prompt: prompts/request-generate.md
  - id: point-leave-user-point-deduct
    prompt: prompts/user-point-deduct.md
  - id: point-dept-point-tracking
    prompt: prompts/dept-point-tracking.md

edges:
  - from: START
    to: point-leave-request-generate
  - from: point-leave-request-generate
    to: point-leave-user-point-deduct
    when: [{type: STATUS, status: SUCCEEDED}]   # when 생략 시에도 동일 (기본값)
  - from: point-leave-user-point-deduct
    to: point-dept-point-tracking
    when: [{type: STATUS, status: SUCCEEDED}]
  - from: point-dept-point-tracking
    to: END
