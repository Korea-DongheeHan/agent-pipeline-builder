# point 프로젝트의 point-dev 하네스 스킬(full-team 경로)을 그래프로 변환한 예제.
#
# 매핑 (자세한 대응·한계는 같은 디렉토리의 README.md):
#   Phase 1-1 분석(point-analyst)            → analyst 노드
#   Phase 2 팀(implementer/test-engineer/qa) → analyst 에서 Fan-Out, qa 에서 Fan-In
#   Phase 3 리뷰(point-reviewer)             → review 노드
#   수렴 루프 (acceptance FAIL → 재작업)      → qa/review 의 FAILED 피드백 엣지
#   2회 연속 FAIL 에스컬레이션               → loop max 2 + on_exhausted: escalate
#
# point 저장소 루트에서 실행해야 한다 (.claude/agents/point-* 정의를 쓰기 때문):
#   cd ~/projects/point
#   python3 <graph-builder>/scripts/run_graph.py \
#     <graph-builder>/examples/point-dev-graph/pipeline.yml \
#     --var requirement="신규 가입자 첫 주문 2배 적립"
name: point-dev-graph
kind: development

settings:
  parallelism: 4
  state_dir: .graph-runs
  claude_args: ["--permission-mode", "acceptEdits"]
  node_timeout: 3600

vars:
  requirement: "구현할 요구사항을 --var requirement=... 로 주입하라"

nodes:
  - id: analyst
    agent: point-analyst          # point 저장소의 .claude/agents 정의를 그대로 사용
    prompt: prompts/analyst.md
  - id: implement
    agent: point-implementer
    prompt: prompts/implement.md
  - id: test
    agent: point-test-engineer
    prompt: prompts/test.md
  - id: qa
    agent: point-qa
    prompt: prompts/qa.md         # join: all (기본) — 구현·테스트 둘 다 끝나야 실행
  - id: review
    agent: point-reviewer
    prompt: prompts/review.md
  - id: escalate
    prompt: prompts/escalate.md   # 루프 소진 시 상황 보고서 작성 후 FAIL 종결

edges:
  - from: START
    to: analyst
  - from: analyst
    to: [implement, test]                  # Phase 2 Fan-Out
  - from: implement
    to: qa
  - from: test
    to: qa                                 # Fan-In
  - from: qa
    to: review
  - from: qa                               # 수렴 루프: QA FAIL 항목 재작업
    to: implement
    when: FAILED
    loop: {max: 2, on_exhausted: escalate}
  - from: review
    to: END                                # APPROVE = 코드 수렴 완료 (커밋은 사람 게이트)
  - from: review                           # REQUEST_CHANGES → 재작업
    to: implement
    when: FAILED
    loop: {max: 2, on_exhausted: escalate}
  - from: escalate
    to: FAIL                               # 보고서 작성 후 의도적 실패 종결
    when: ALWAYS
