<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="graph-builder: pipeline.yml compiled into a deterministic multi-agent graph">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1e293b"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#0f172a"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- title -->
  <text x="64" y="92" font-family="ui-sans-serif,-apple-system,'Segoe UI',sans-serif" font-size="46" font-weight="700" fill="#f1f5f9">graph-builder</text>
  <text x="64" y="128" font-family="ui-sans-serif,-apple-system,'Segoe UI',sans-serif" font-size="19" fill="#94a3b8">YAML in. Deterministic multi-agent pipeline out.</text>

  <!-- yaml card -->
  <rect x="64" y="176" width="372" height="368" rx="14" fill="#16233b" stroke="#2b3b55"/>
  <circle cx="92" cy="206" r="5" fill="#f87171"/>
  <circle cx="110" cy="206" r="5" fill="#fbbf24"/>
  <circle cx="128" cy="206" r="5" fill="#34d399"/>
  <text x="148" y="211" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#64748b">pipeline.yml</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
    <text x="92" y="250" fill="#7dd3fc">workflow:</text>
    <text x="110" y="277" fill="#e2e8f0">- analyst</text>
    <text x="110" y="304" fill="#fbbf24">- spec-gate</text>
    <text x="110" y="331"><tspan fill="#7dd3fc">- parallel:</tspan><tspan fill="#a5b4fc"> [implement, test]</tspan></text>
    <text x="110" y="358" fill="#e2e8f0">- qa:</text>
    <text x="146" y="385"><tspan fill="#7dd3fc">if:</tspan><tspan fill="#fb7185"> FAILED</tspan></text>
    <text x="146" y="412"><tspan fill="#7dd3fc">goto:</tspan><tspan fill="#34d399"> implement</tspan></text>
    <text x="146" y="439"><tspan fill="#7dd3fc">max:</tspan><tspan fill="#e2e8f0"> 2</tspan></text>
    <text x="146" y="466"><tspan fill="#7dd3fc">exhausted:</tspan><tspan fill="#e2e8f0"> escalate</tspan></text>
    <text x="110" y="493" fill="#e2e8f0">- review:</text>
    <text x="146" y="520"><tspan fill="#7dd3fc">if:</tspan><tspan fill="#fb7185"> FAILED</tspan><tspan fill="#64748b"> ...</tspan></text>
  </g>

  <!-- compile arrow -->
  <line x1="452" y1="330" x2="524" y2="330" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="488" y="314" font-family="ui-sans-serif,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#64748b" text-anchor="middle">compiles to</text>

  <!-- feedback loops (drawn first, behind nodes) -->
  <path d="M 1012,281 C 992,232 928,208 902,214" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arF)"/>
  <path d="M 1146,281 C 1104,196 952,182 890,208" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arF)"/>
  <text x="1024" y="192" font-family="ui-sans-serif,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle">if FAILED · rework (max 2)</text>

  <!-- exhausted path -->
  <path d="M 1012,323 C 1012,382 1016,414 1021,432" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="2 5" marker-end="url(#arX)"/>
  <path d="M 1146,323 C 1140,390 1096,424 1066,438" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="2 5" marker-end="url(#arX)"/>
  <text x="1105" y="392" font-family="ui-sans-serif,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#fb7185">exhausted</text>

  <!-- forward edges -->
  <line x1="644" y1="302" x2="672" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="784" y1="291" x2="816" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="784" y1="313" x2="816" y2="364" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="928" y1="240" x2="956" y2="291" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="928" y1="364" x2="956" y2="313" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1064" y1="302" x2="1090" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1202" y1="302" x2="1216" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1076" y1="452" x2="1124" y2="452" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="2 5" marker-end="url(#arX)"/>

  <!-- nodes -->
  <g font-family="ui-sans-serif,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <rect x="540" y="281" width="104" height="42" rx="10" fill="#2563eb"/>
    <text x="592" y="307" fill="#ffffff">analyst</text>

    <rect x="672" y="281" width="116" height="42" rx="10" fill="#d97706"/>
    <rect x="684" y="296" width="4" height="12" rx="1.5" fill="#ffffff"/>
    <rect x="691" y="296" width="4" height="12" rx="1.5" fill="#ffffff"/>
    <text x="744" y="307" fill="#ffffff">spec-gate</text>

    <rect x="820" y="219" width="108" height="42" rx="10" fill="#059669"/>
    <text x="874" y="245" fill="#ffffff">implement</text>

    <rect x="820" y="343" width="108" height="42" rx="10" fill="#0d9488"/>
    <text x="874" y="369" fill="#ffffff">test</text>

    <rect x="960" y="281" width="104" height="42" rx="10" fill="#7c3aed"/>
    <text x="1012" y="307" fill="#ffffff">qa</text>

    <rect x="1094" y="281" width="104" height="42" rx="10" fill="#a21caf"/>
    <text x="1146" y="307" fill="#ffffff">review</text>

    <rect x="976" y="434" width="100" height="36" rx="10" fill="#334155"/>
    <text x="1026" y="457" fill="#cbd5e1" font-size="14">escalate</text>
  </g>

  <!-- END check -->
  <circle cx="1238" cy="302" r="16" fill="#16a34a"/>
  <path d="M 1230,302 L 1236,309 L 1247,295" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- FAIL cross -->
  <circle cx="1144" cy="452" r="14" fill="#be123c"/>
  <path d="M 1138,446 L 1150,458 M 1150,446 L 1138,458" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- caption -->
  <text x="884" y="560" font-family="ui-sans-serif,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#64748b" text-anchor="middle">fan-out / fan-in · human spec gate · convergence loop · fail-safe escalation</text>
</svg>
